name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Deploy to Production
        run: |
          echo "Simulating deployment script..."
          # In a real scenario, this would securely SSH into the server and run:
          # ssh deploy@server 'cd /app && git pull && npm ci && npm run reload:cluster'
          echo "Deployment successful."
